<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#030712"/>
  <defs>
    <radialGradient id="ecoliGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="divGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Darkfield optical background texture -->
  <g opacity="0.15">
    <circle cx="100" cy="150" r="1.5" fill="#94a3b8"/>
    <circle cx="280" cy="80" r="1" fill="#94a3b8"/>
    <circle cx="650" cy="120" r="2" fill="#94a3b8"/>
    <circle cx="720" cy="450" r="1.5" fill="#94a3b8"/>
    <circle cx="150" cy="480" r="1" fill="#94a3b8"/>
    <circle cx="520" cy="520" r="1" fill="#94a3b8"/>
  </g>

  <!-- Cell 1: Central Dividing E. coli with FtsZ ring -->
  <g transform="translate(380, 300) rotate(-15)">
    <!-- Outer Cell Wall -->
    <rect x="-180" y="-55" width="360" height="110" rx="55" fill="#071b26" stroke="#0284c7" stroke-width="2.5" filter="url(#softGlow)"/>
    <!-- Nucleoid lobes (DAPI/Hoechst stain representation) -->
    <ellipse cx="-85" cy="0" rx="60" ry="28" fill="#38bdf8" opacity="0.45" filter="url(#softGlow)"/>
    <ellipse cx="85" cy="0" rx="60" ry="28" fill="#38bdf8" opacity="0.45" filter="url(#softGlow)"/>
    <!-- Chromosome supercoiled strands -->
    <path d="M-120 -10 Q-90 18 -60 -8 Q-35 12 -15 -5" fill="none" stroke="#e0f2fe" stroke-width="2" opacity="0.8"/>
    <path d="M15 5 Q40 -12 70 10 Q100 -15 130 5" fill="none" stroke="#e0f2fe" stroke-width="2" opacity="0.8"/>
    <!-- Division Constriction & FtsZ ring -->
    <line x1="0" y1="-56" x2="0" y2="56" stroke="#f97316" stroke-width="4.5" stroke-linecap="round" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="12" fill="url(#divGlow)"/>
    <!-- Membrane constriction notches -->
    <path d="M-8 -55 Q0 -40 8 -55" fill="#030712"/>
    <path d="M-8 55 Q0 40 8 55" fill="#030712"/>
  </g>

  <!-- Cell 2: Elongating Vegetative Cell (top right) -->
  <g transform="translate(600, 160) rotate(35)">
    <rect x="-110" y="-36" width="220" height="72" rx="36" fill="#071b26" stroke="#0284c7" stroke-width="2" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="75" ry="18" fill="#38bdf8" opacity="0.4"/>
    <path d="M-60 -5 Q-20 10 20 -8 Q50 6 70 -4" fill="none" stroke="#bae6fd" stroke-width="1.8" opacity="0.7"/>
  </g>

  <!-- Cell 3: Stationary phase short rod (bottom left) -->
  <g transform="translate(180, 420) rotate(-40)">
    <rect x="-90" y="-38" width="180" height="76" rx="38" fill="#071b26" stroke="#0284c7" stroke-width="2" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="55" ry="20" fill="#38bdf8" opacity="0.4"/>
    <path d="M-45 0 Q-10 -10 20 8 Q45 -5 55 2" fill="none" stroke="#bae6fd" stroke-width="1.8" opacity="0.7"/>
  </g>

  <!-- Scientific Legend & Scale Bar -->
  <g transform="translate(40, 530)">
    <line x1="0" y1="20" x2="100" y2="20" stroke="#f8fafc" stroke-width="3"/>
    <line x1="0" y1="14" x2="0" y2="26" stroke="#f8fafc" stroke-width="2"/>
    <line x1="100" y1="14" x2="100" y2="26" stroke="#f8fafc" stroke-width="2"/>
    <text x="50" y="38" font-family="monospace, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">2.0 μm</text>
  </g>

  <g transform="translate(540, 525)">
    <rect x="0" y="0" width="220" height="50" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="18" r="5" fill="#38bdf8"/>
    <text x="34" y="22" font-family="sans-serif" font-size="11" fill="#cbd5e1">Nucleoid (Chromosome)</text>
    <circle cx="20" cy="34" r="5" fill="#f97316"/>
    <text x="34" y="38" font-family="sans-serif" font-size="11" fill="#cbd5e1">FtsZ Division Ring</text>
  </g>

  <!-- Title Annotation -->
  <text x="40" y="50" font-family="'Lora', Georgia, serif" font-size="20" font-weight="bold" fill="#f8fafc">Escherichia coli Cell Division Dynamics</text>
  <text x="40" y="72" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#94a3b8">Single-cell fluorescence microscopy &bull; Division septation</text>
</svg>
