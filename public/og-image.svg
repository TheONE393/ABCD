<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#07151b"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bg-gradient)" opacity="0.8"/>

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="150" r="300" fill="#19566a" opacity="0.4" filter="blur(80px)"/>
  <circle cx="1050" cy="450" r="280" fill="#f97316" opacity="0.25" filter="blur(90px)"/>

  <!-- Border & Grid Lines -->
  <rect x="40" y="40" width="1120" height="550" rx="24" stroke="#19566a" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Lab Icon -->
  <g transform="translate(100, 120)">
    <rect width="72" height="72" rx="18" fill="#19566a"/>
    <circle cx="36" cy="36" r="18" stroke="#2dd4bf" stroke-width="3" fill="none"/>
    <circle cx="36" cy="36" r="6" fill="#f97316"/>
    <path d="M36 8v8M36 56v8M8 36h8M56 36h8" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="190" y="165" fill="#2dd4bf" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="3" text-transform="uppercase">The [Lastname] Laboratory</text>
  
  <text x="100" y="270" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Microbial Genetics &amp; Evolutionary Biology</text>
  
  <text x="100" y="340" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400">Investigating Pseudomonas pathogenesis, E. coli resilience &amp; Asgard archaea</text>

  <!-- Model Organism Pills -->
  <g transform="translate(100, 420)">
    <!-- Pseudomonas Pill -->
    <rect x="0" y="0" width="220" height="52" rx="14" fill="#0f2731" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="110" y="32" fill="#2dd4bf" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" font-style="italic" text-anchor="middle">Pseudomonas</text>

    <!-- E. coli Pill -->
    <rect x="240" y="0" width="180" height="52" rx="14" fill="#0f2731" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="330" y="32" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" font-style="italic" text-anchor="middle">Escherichia coli</text>

    <!-- Asgard Archaea Pill -->
    <rect x="440" y="0" width="220" height="52" rx="14" fill="#0f2731" stroke="#f97316" stroke-width="1.5"/>
    <text x="550" y="32" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" font-style="italic" text-anchor="middle">Asgard Archaea</text>
  </g>

  <!-- URL footer -->
  <text x="100" y="530" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">Department of Molecular &amp; Cellular Biology</text>

  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f2731" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#07151b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#02080c"/>
    </linearGradient>
  </defs>
</svg>
